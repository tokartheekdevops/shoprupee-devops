apiVersion: apps/v1
kind: Deployment

metadata:
  name: shoprupee
  namespace: shoprupee

spec:
  replicas: 4

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: shoprupee

  template:

    metadata:
      labels:
        app: shoprupee

    spec:

      # Private Amazon ECR authentication
      imagePullSecrets:
        - name: ecr-registry-secret

      # Select the node labeled dedicated=nginx
      nodeSelector:
        dedicated: nginx

      # Allow the Pod to run on the tainted node
      tolerations:
        - key: dedicated
          operator: Equal
          value: nginx
          effect: NoSchedule

      containers:

        - name: shoprupee

          image: SHOPRUPEE_ECR_IMAGE

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # Readiness Probe
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          # Liveness Probe
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Resource Management
          resources:

            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 128Mi
